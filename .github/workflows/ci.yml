name: CI

# 触发：push 到 main、PR、手动。
#
# ## 这个工作流要保证的一件事
#
# 「**不产出跑不起来或有功能缺陷的产物**」。光"编译通过"是不够的 —— 编译通过只说明
# 代码能生成二进制，说明不了它能用，更说明不了它在**别的架构**上能用。引擎里大量
# `#[cfg(target_arch = "x86_64")]` 的 SIMD 实现配上非 x86 的桩，桩不参与 x86 构建，
# 于是「Intel 上一切正常、arm64 上编译不过」这种事会反复发生（已经发生过两次）。
#
# 所以流程是三层，逐层收紧（与 XferRust 的流程一致）：
#
#   build         每个平台**原生**跑全量测试 → 通过才构建 → 冒烟 → 打包 → 上传
#   modules-check 所有模块组合的编译门禁（不产生产物，防止 feature 开关腐烂）
#   verify        下载**打包好的产物**，用产物本身再跑一遍验收（架构 / 模块 / 契约）
#   release       只有上面全部绿了才动 Release（草稿；只收桌面端默认的 mux 产物）
#
# 为什么 `verify` 不能省：`build` 验的是"这棵树"，`verify` 验的是"这个二进制"。
# 中间隔着打包这一步（选错文件、漏拷、架构不对、tar 坏掉），而后者才是要发出去的东西。
# 触发路径：**只有会改变产物的文件才触发构建**。
#
# 为什么用白名单（`paths:`）而不是黑名单（`paths-ignore:`）：漏掉一个该触发
# 的路径，症状是"推上去了但 CI 没跑"，而且是**静默的** —— 比多跑一次构建贵得多。
# 所以这里把"会进产物 / 会被 CI 用到"的东西逐个列出来，加新的构建输入时
# 必须一起加这里。
#
# 不触发的（故意的）：`*.md`（README / AV1-AUDIT / *-HANDOFF）、`LICENSE`、
# `.gitignore`、`tools/`（分析脚本，不参与构建与测试）。
# ⚠️ 代价要说清楚：只改文档时 `release` 作业也不会跑，草稿 Release 的说明不会更新。
#    需要更新时用 Actions 页面的 "Run workflow"（`workflow_dispatch`）手动触发。
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'          # CI 会调用这里的脚本
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      modules:
        description: '要构建的模块（逗号分隔：audio / video / mux；可任意组合）'
        required: false
        default: 'mux'
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ── 应用 → 模块 ───────────────────────────────────────────────────────────
  # 产物只编"这个应用真正用到的模块"。目前只有桌面端（Lerxu）在消费这些产物，
  # 它的播放功能暂时停用（只需 probe / mux / remux）⇒ 只编 mux。
  # 以后新增应用：在这里按 job/matrix 给它自己的 ENGINE_MODULES，不要把所有
  # 模块都塞进每个产物。手动触发时可用 inputs.modules 覆盖（默认仍是 mux）。
  ENGINE_MODULES: ${{ github.event.inputs.modules || 'mux' }}

# ── 按应用裁剪模块 ───────────────────────────────────────────────────────────
# 引擎支持三个可组合的模块：audio（音频解析/解码）、video（视频解析/解码）、
# mux（音视频合并/转封装）。发布产物只编**应用真正用到的模块**：
#
#   Lerxu 桌面端 → mux
#     播放功能暂时停用（`MEDIA_PLAYER_ENABLED = false`），只调 probe / mux / remux；
#     编进 audio/video 只会让每个安装包白背几 MB 解码器。
#
# 需要完整引擎时用 Actions 的 "Run workflow"，把 modules 填成 audio,video,mux。
# 非默认组合的产物名会带 `-audio-video-mux` 这类后缀，且只上传 Actions artifact、
# 不进 Release（Release 只收桌面端默认的 mux 产物）。
# 各组合的编译门禁在 `modules-check`（不产生产物）。
#
# 新增应用时：给它的构建 job/matrix 设置自己的 ENGINE_MODULES 与产物名，
# 不要让所有应用共用一份"全量"产物。

jobs:
  # ---------------------------------------------------------------------------
  # 构建 + 测试 + 打包。测试**在同一个任务里、构建之前**跑：
  # 这样任何一个平台的测试不过，那个平台就不会有产物产出。
  #
  # 四个运行器各管一段架构，本地（单机）测不到的路径由它们兜住：
  #   · macos-26-intel → Intel Mac 原生（调用方桌面端的主力场景；Intel 上没有 AV1 硬解）
  #   · macos-latest   → Apple Silicon 原生（当前解析到 macOS 26 arm64）
  #   · ubuntu-latest  → Linux x86_64 原生
  #   · windows-latest → Windows x86_64-msvc 原生（ring 需要 nasm，镜像里自带）
  # 另加 linux-arm64 交叉构建（x64 runner 跑不了 aarch64，只验证编得过与产物架构）。
  #
  # ⚠️ Intel 那格必须用**当前有效**的标签，这里踩过一次坑，记清楚症状：
  #   `macos-13` 已于 2025-12-04 完全退役。而 GitHub 对"标签匹配不到任何运行器"的
  #   处理方式是**一直排队到 24 小时上限再自动取消** —— 不报错、日志区空白、
  #   只显示"等有人来接单"。因为 release 依赖整条链，这会连带把发版一起卡住 24 小时。
  #   排查口径：**排队超过几分钟就是标签问题，不是容量问题**（容量问题会等到、
  #   只是慢）。标签清单以 github.com/actions/runner-images 的 Available Images 表为准。
  #   Intel x64 的**标准**（非 large/付费）标签现在只剩 macos-26-intel 与 macos-15-intel，
  #   本仓库用前者（最新 ⇒ 支持期最长；macos-latest 也已是 macOS 26）。
  #   注意 macos-*-large 是 larger runner（另计费），别误用。
  # ---------------------------------------------------------------------------
  build:
    name: Build zuvrust-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel 产物用 Intel 运行器**原生**构建 + 原生测试：交叉编译只能证明
          # "编得过"，证明不了"在这台机器上跑得起来"（SIMD 桩、VideoToolbox 探测都不同）。
          - os: macos-26-intel
            artifact: darwin-x86_64
            target: ""
            runnable: true
          - os: macos-latest
            artifact: darwin-arm64
            target: ""
            runnable: true
          - os: ubuntu-latest
            artifact: linux-x86_64
            target: ""
            runnable: true
          - os: windows-latest
            artifact: windows-x86_64
            target: ""
            runnable: true
          # linux-arm64：x64 runner 跑不了 aarch64，且 ring 需要交叉 C 工具链 ⇒
          # 用 cargo-zigbuild（zig 兼任 C 编译器与链接器）。只验证编得过与产物架构。
          - os: ubuntu-latest
            artifact: linux-arm64
            target: aarch64-unknown-linux-musl
            runnable: false
    steps:
      - uses: actions/checkout@v5

      # 产物名默认与宿主回填约定一致（zuvrust-<平台>.tar.gz）；手动选了别的模块
      # 组合时加后缀，避免把"只有音频"的包覆盖到桌面端 mux 产物上。
      - name: 校验模块参数 / 计算产物名后缀
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$ENGINE_MODULES" ] || { echo "::error::ENGINE_MODULES 不能为空"; exit 1; }
          for m in ${ENGINE_MODULES//,/ }; do
            case "$m" in
              audio|video|mux) ;;
              *) echo "::error::未知模块 $m（只认 audio / video / mux）"; exit 1 ;;
            esac
          done
          if [ "$ENGINE_MODULES" = "mux" ]; then
            echo "ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_SUFFIX=-${ENGINE_MODULES//,/-}" >> "$GITHUB_ENV"
          fi
          echo "本次构建模块：$ENGINE_MODULES"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      # 顺手把仓库里的 shell 脚本查一遍（语法 + 一个真实踩过的坑：
      # `$VAR` 紧跟中文标点时 bash 会把标点算进变量名）。只在一个条目上跑。
      - name: 脚本静态检查
        if: matrix.artifact == 'linux-x86_64'
        shell: bash
        run: ./scripts/lint-shell.sh

      # ── 测试（构建之前）───────────────────────────────────────────────────
      # 契约测试先单独点一次名，因为**它才是"多平台适配"这件事本身的门禁** ——
      # 其余测试验业务逻辑，只有它验"调用方与引擎之间的接口在这个平台上还成立"
      # （退出码、日志是否上色、stderr 编码、路径含空格与中文、文件句柄）。
      # 先跑它是因为它快（秒级），失败时能立刻定位到接口层而不是业务层。
      - name: 契约测试（调用方接口的门禁）
        if: matrix.runnable
        shell: bash
        run: cargo test -p me-cli --test cli_contract

      - name: 全量测试（单元 + 集成）
        if: matrix.runnable
        shell: bash
        run: cargo test --workspace

      # 上面跑的是"所有模块都开"的树；这一步跑**要发出去的那个 feature 组合**。
      # 裁剪最容易坏在"测试一直用全量、产物却是子集"：某个命令在子集下根本
      # 编不过，CI 却全绿。mux 组合会跑 cli_contract / mux_cli / lossless /
      # mux_scenarios；audio / video 组合跑各自的单元测试。
      - name: 产物同款模块测试
        if: matrix.runnable
        shell: bash
        run: cargo test -p me-cli --no-default-features --features "$ENGINE_MODULES"

      # 交叉到 aarch64-linux 再编一遍核心层，补上**原生运行器覆盖不到的那一格**：
      # 四个原生运行器已覆盖 x86_64/arm64 的 macOS、x86_64 的 Linux 与 Windows，
      # 唯一没被原生验证的就是 aarch64-linux。`--all-targets` 不能省 ——
      # 漏掉它就编译不到 `#[cfg(test)]` 里的调用点，而上次的真实故障
      # （桩签名抄错）恰好只在测试代码里暴露。
      - name: 交叉编译检查（aarch64-linux 核心层，含测试目标）
        if: matrix.artifact == 'linux-arm64'
        shell: bash
        run: ./scripts/check-arches.sh aarch64-unknown-linux-musl

      # ── 构建 ──────────────────────────────────────────────────────────────
      - name: Build（按应用所需模块）
        if: matrix.target == ''
        shell: bash
        run: |
          set -euo pipefail
          EXT=; [ "$RUNNER_OS" = "Windows" ] && EXT=.exe
          ./scripts/build-modules.sh --release --modules="$ENGINE_MODULES"
          BIN="target/release/zuvrust$EXT"
          file "$BIN"
          "$BIN" version --json

      - name: Cross build linux-arm64（musl 静态，x64 runner 无法运行）
        if: matrix.artifact == 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/zigbuild-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --quiet cargo-zigbuild
          export PATH="$VENV/bin:$PATH"
          ./scripts/build-modules.sh --release --modules="$ENGINE_MODULES" \
            --target="${{ matrix.target }}" --zigbuild
          file "target/${{ matrix.target }}/release/zuvrust"

      # ── 打包 ──────────────────────────────────────────────────────────────
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          EXT=; [ "$RUNNER_OS" = "Windows" ] && EXT=.exe
          if [ -n "${{ matrix.target }}" ]; then
            BIN="target/${{ matrix.target }}/release/zuvrust$EXT"
          else
            BIN="target/release/zuvrust$EXT"
          fi
          mkdir -p "pkg/zuvrust-${{ matrix.artifact }}${ARTIFACT_SUFFIX}"
          cp "$BIN" "pkg/zuvrust-${{ matrix.artifact }}${ARTIFACT_SUFFIX}/zuvrust$EXT"
          cp LICENSE README.md "pkg/zuvrust-${{ matrix.artifact }}${ARTIFACT_SUFFIX}/"
          tar -C "pkg/zuvrust-${{ matrix.artifact }}${ARTIFACT_SUFFIX}" \
            -czf "zuvrust-${{ matrix.artifact }}${ARTIFACT_SUFFIX}.tar.gz" "zuvrust$EXT" LICENSE README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.artifact }}
          path: zuvrust-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 模块组合门禁：产物只用一种组合（桌面端 mux），但 **feature 开关本身**要
  # 经得起所有组合。这里不产出任何东西，只回答一个问题：
  # "把不用的模块关掉之后，剩下的代码还编得过吗（包括测试目标）？"
  #
  # 为什么单独一个 job：跑在 Linux 上就够（feature 组合是平台无关的），
  # 五个平台的矩阵已经跑全量测试，不必把组合数再乘一遍平台数。
  # ---------------------------------------------------------------------------
  modules-check:
    name: 模块组合编译检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: modules-check

      - name: crate 级开关（audio / video / mux）
        shell: bash
        run: |
          set -euo pipefail
          for f in audio video; do
            echo "=== me-decode: ${f}"
            cargo test -p me-decode --no-default-features --features "$f" --lib --no-run
          done
          echo "=== me-mux: convert only"
          cargo test -p me-mux --no-default-features --lib --no-run
          echo "=== me-mux: convert + muxers"
          cargo test -p me-mux --lib --no-run

      - name: CLI 所有模块组合（含测试目标）
        shell: bash
        run: |
          set -euo pipefail
          for f in audio video mux audio,video audio,mux video,mux audio,video,mux; do
            echo "=== me-cli: ${f}"
            cargo check -p me-cli --all-targets --no-default-features --features "$f"
          done

      - name: 产物同款组合跑测试
        shell: bash
        run: cargo test -p me-cli --no-default-features --features "$ENGINE_MODULES"

  # ---------------------------------------------------------------------------
  # 产物验收：**下载打包好的产物**，用这个二进制本身再跑一遍。
  #
  # 与 build 的分工：build 证明"这棵树在这个平台上是对的"，这里证明
  # "**这个要发出去的二进制**是对的"。两者之间夹着打包，会出的事包括：
  # 打错文件、漏拷、tar 损坏、产物架构与标注不符、下载后带上 quarantine 标记。
  #
  # 只在**能原生运行该架构**的平台跑（linux-arm64 交叉产物跳过 —— x64 runner
  # 跑不了 aarch64，硬跑只能得到"Exec format error"这种没有信息量的失败）。
  # ---------------------------------------------------------------------------
  verify:
    name: Verify zuvrust-${{ matrix.artifact }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            artifact: darwin-x86_64
            expect_arch: "Mach-O 64-bit executable x86_64"
            bin: zuvrust
          - os: macos-latest
            artifact: darwin-arm64
            expect_arch: "Mach-O 64-bit executable arm64"
            bin: zuvrust
          - os: ubuntu-latest
            artifact: linux-x86_64
            expect_arch: "ELF 64-bit LSB pie executable, x86-64"
            bin: zuvrust
          - os: windows-latest
            artifact: windows-x86_64
            expect_arch: "PE32+ executable"
            bin: zuvrust.exe
    steps:
      - uses: actions/checkout@v5

      - name: 计算产物名后缀
        shell: bash
        run: |
          if [ "$ENGINE_MODULES" = "mux" ]; then
            echo "ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_SUFFIX=-${ENGINE_MODULES//,/-}" >> "$GITHUB_ENV"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: verify-${{ matrix.artifact }}

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: build-${{ matrix.artifact }}
          path: pkg/

      # 解包 → 架构核对 → 包内容齐全 → 能起来 → **用产物本身跑契约测试**。
      # 逻辑放在 scripts/verify-artifact.sh 里，本地可以用同一条命令复现
      # （CI 里内联一坨 shell 的坏处是：只有推上去才知道写得对不对）。
      - name: 产物验收
        shell: bash
        run: |
          ./scripts/verify-artifact.sh \
            "pkg/zuvrust-${{ matrix.artifact }}${ARTIFACT_SUFFIX}.tar.gz" \
            "${{ matrix.bin }}" \
            "${{ matrix.expect_arch }}" \
            "$ENGINE_MODULES"

      - name: Upload 失败日志
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: verify-logs-${{ matrix.artifact }}
          path: pkg/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 发布：构建 + 产物验收全绿后，按代码版本号管理草稿 Release（不自动发布）。
  # 与 XferRust 的约定一致：产物每次覆盖草稿，确认无误后再手动点 Publish。
  # ---------------------------------------------------------------------------
  release:
    name: Release (草稿/不覆盖已发布)
    # 只有默认的桌面端 mux 组合进 Release；手动构建 audio/video/full 只上传
    # Actions artifact（供验收/分发），不碰已经发布或草稿里的桌面端产物。
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.modules == '' || github.event.inputs.modules == 'mux'))
    needs: [build, verify, modules-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create or update release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [ -n "$VERSION" ] || { echo "无法从 Cargo.toml 提取版本号"; exit 1; }
          TAG="v${VERSION}"
          echo "当前代码版本: ${TAG}"
          ls -1 artifacts/*.tar.gz

          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$IS_DRAFT" = "false" ]; then
            echo ">>> ${TAG} 已发布 → 不覆盖，跳过"
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo ">>> 草稿 ${TAG} 已存在 → 覆盖产物"
            gh release upload "$TAG" artifacts/*.tar.gz --clobber
          else
            echo ">>> 无 ${TAG} Release → 首次创建为草稿"
            gh release create "$TAG" artifacts/*.tar.gz \
              --title "v${VERSION}" --draft --generate-notes
          fi
