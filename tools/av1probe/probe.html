<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<pre id="out">running</pre>
<script>
const lines = [];
function say(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }
(async () => {
  try {
    if (typeof VideoEncoder === 'undefined') { say('NO VideoEncoder'); return; }
    const cfgs = [
      { codec: 'av01.0.04M.08', width: 64, height: 64, bitrate: 100000, framerate: 30 },
      { codec: 'av01.0.00M.08', width: 64, height: 64, bitrate: 100000, framerate: 30 },
      { codec: 'av01.0.04M.10', width: 64, height: 64, bitrate: 100000, framerate: 30 },
    ];
    for (const cfg of cfgs) {
      try {
        const sup = await VideoEncoder.isConfigSupported(cfg);
        say('PROBE ' + cfg.codec + ' supported=' + sup.supported);
      } catch (e) { say('PROBE ' + cfg.codec + ' EXC ' + e.message); }
    }
    say('hardwareAcceleration n/a');
  } catch (e) { say('EXC ' + e.message); }
})();
</script>
</body></html>
