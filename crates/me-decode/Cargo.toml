[package]
name = "me-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZuvRust 解码层：把压缩采样解成帧（硬解优先，自研软解兜底）"

# 按需裁剪：只编音频或只编视频时，另一半（以及平台硬解）完全不参与编译。
# 默认全开，保持 `cargo build/test` 的原有行为。
[features]
default = ["audio", "video"]
audio = []
video = []

[dependencies]
me-core = { workspace = true }
tracing = { workspace = true }
